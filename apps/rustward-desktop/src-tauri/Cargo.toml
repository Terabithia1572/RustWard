[package]
name = "rustward-desktop"
description = "RustWard desktop administration app (Tauri 2 shell). The UI talks to the backend only through the single validated `ipc_call` command."
version = "1.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

# Kept outside the root workspace: Tauri needs WebView2 (Windows) or
# webkit2gtk (Linux) system libraries that the CI/dev container lacks, so the
# rest of the workspace stays buildable everywhere.
[workspace]

[build-dependencies]
tauri-build = { version = "2.7.4", default-features = false, features = [] }

[dependencies]
tauri = { version = "2.12.5", default-features = false, features = ["wry", "compression"] }
rustward-ipc = { path = "../../../crates/rustward-ipc" }
rustward-ui-bridge = { path = "../../../crates/rustward-ui-bridge" }

[dev-dependencies]
tauri = { version = "2.12.5", default-features = false, features = ["wry", "compression", "test"] }
serde_json = "1.0.154"

[features]
# The in-process development backend is additionally gated on
# debug_assertions inside rustward-ui-bridge, so `tauri build` (release)
# can never include it even with this feature on.
default = ["dev-backend"]
dev-backend = ["rustward-ui-bridge/dev-backend"]
# Preview builds only: no console window in a debug build. Changes nothing
# else (backend selection still follows debug_assertions + dev-backend).
gui-subsystem = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
