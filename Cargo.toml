[workspace]
resolver = "3"
members = [
    "crates/rustward-core",
    "crates/rustward-windows",
    "crates/rustward-enforcement",
    "crates/rustward-inventory",
    "crates/rustward-storage",
    "crates/rustward-ipc",
    "crates/rustward-app",
    "crates/rustward-service",
    "crates/rustward-ui-bridge",
]
# The Tauri shell is its own workspace (needs WebView2/WebKit system libraries).
exclude = ["apps/rustward-desktop/src-tauri"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.90"
publish = false

# Versions recorded in docs/PHASE-STATUS.md; exact resolution is pinned by Cargo.lock.
[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
] }
# Bundled SQLite: no system library needed on the offline workstations.
rusqlite = { version = "0.41.1", features = ["bundled", "backup"] }
sha2 = "0.11.1"
# Only for the documented NT SERVICE SID derivation (not a security hash use).
sha1 = "0.11.0"
rustward-core = { path = "crates/rustward-core" }
rustward-storage = { path = "crates/rustward-storage" }
rustward-ipc = { path = "crates/rustward-ipc" }
rustward-app = { path = "crates/rustward-app" }
rustward-ui-bridge = { path = "crates/rustward-ui-bridge" }
rustward-windows = { path = "crates/rustward-windows" }
rustward-enforcement = { path = "crates/rustward-enforcement" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
