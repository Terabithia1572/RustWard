[package]
name = "rustward-notifier"
description = "Out-of-Session-0 per-user Windows desktop notification agent for RustWard. Reads only the unprivileged status named pipe and persists preferences per interactive user."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "rustward-notifier"
path = "src/main.rs"

[features]
# Compile (type-check) pipe client calls on non-Windows hosts.
host-typecheck = ["rustward-ipc/host-typecheck"]

[dependencies]
rustward-ipc.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
