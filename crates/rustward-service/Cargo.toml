[package]
name = "rustward-service"
description = "RustWard Windows service host: background inventory refresh, health, retention, IPC servers. SCM integration is Windows-only and NOT VERIFIED."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "rustward-service"
path = "src/main.rs"

[features]
# Type-check the named-pipe server code on non-Windows hosts.
host-typecheck = ["rustward-ipc/host-typecheck"]

[dependencies]
rustward-app.workspace = true
rustward-core.workspace = true
rustward-ipc.workspace = true
rustward-storage.workspace = true

[target.'cfg(windows)'.dependencies]
windows-service = "0.8.1"

[lints]
workspace = true
