# cargo-deny policy (Phase 9A). Run: cargo deny check
# Advisories need the RustSec database: on a connected machine it is fetched
# automatically; on the air-gapped build machine copy the advisory-db
# checkout and run `cargo deny check --disable-fetch` (docs/RELEASE-READINESS.md).

[graph]
all-features = true
# Only the shipped target matters (Linux-only GTK/webkit crates used by the
# development container are excluded).
targets = ["x86_64-pc-windows-msvc"]

[advisories]
yanked = "deny"

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0", "Unlicense", "Zlib", "BSD-3-Clause", "BSD-2-Clause", "ISC", "MPL-2.0", "CC0-1.0", "BSL-1.0", "CDLA-Permissive-2.0"]
confidence-threshold = 0.9
unused-allowed-license = "allow"
# Workspace crates are publish = false and proprietary to the project.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between private workspace crates are not wildcards.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
